# Agent A (Linux)
name: "Hermes-Linux"

directories:
  inbox:  "./inbox"
  outbox: "./outbox"
  archive: "./archive"

transport:
  type: scp
  host: "192.168.1.12"
  user: "10238"
  port: 22
  # key: "~/.ssh/id_ed25519"  # optional

agent:
  type: hermes
  command: "hermes"
  extra_args: []

agent_timeout: 180

classifier:
  short_threshold: 50
  long_threshold: 200
  agent_keywords: ["帮我", "请", "怎么", "explain"]
  task_keywords: ["执行", "部署", "run", "deploy"]
